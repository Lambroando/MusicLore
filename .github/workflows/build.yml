name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Normalizza icona in PNG 1024x1024
        run: |
          ICON="Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          if [ ! -f "$ICON" ]; then
            echo "ERRORE: File $ICON non trovato nel repository!"
            find Sources -maxdepth 4
            exit 1
          fi
          sips -s format png -z 1024 1024 "$ICON" --out "$ICON"

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera progetto Xcode e aggiorna versione in Info.plist
        run: |
          xcodegen generate
          VERSION="1.0.${{ github.run_number }}"
          BUILD="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" Info.plist

      - name: Compila app non firmata
        run: |
          VERSION="1.0.${{ github.run_number }}"
          BUILD="${{ github.run_number }}"
          xcodebuild \
            -project MusicLore.xcodeproj \
            -scheme MusicLore \
            -configuration Release \
            -sdk iphoneos \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT=build \
            build

      - name: Verifica icona e versione nel bundle
        run: |
          APP_PLIST="build/Release-iphoneos/MusicLore.app/Info.plist"
          EXPECTED_VERSION="1.0.${{ github.run_number }}"
          EXPECTED_BUILD="${{ github.run_number }}"
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST")
          echo "Versione bundle: $ACTUAL_VERSION ($ACTUAL_BUILD)"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ] || [ "$ACTUAL_BUILD" != "$EXPECTED_BUILD" ]; then
            echo "ERRORE: Versione nel bundle ($ACTUAL_VERSION / $ACTUAL_BUILD) diversa da quella attesa ($EXPECTED_VERSION / $EXPECTED_BUILD)!"
            exit 1
          fi
          if [ ! -f "build/Release-iphoneos/MusicLore.app/Assets.car" ]; then
            echo "ERRORE: Assets.car non generato!"
            exit 1
          fi

      - name: Impacchetta file .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/MusicLore.app Payload/
          zip -r MusicLore.ipa Payload

      - name: Carica .ipa come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLore-IPA
          path: MusicLore.ipa

      - name: Pubblica Release e aggiorna SideStore source.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          BUILD="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          TAG="v${VERSION}"
          IPA_SIZE=$(stat -f%z MusicLore.ipa)
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_MSG=$(git log -1 --pretty=%s)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MusicLore.ipa --clobber
          else
            gh release create "$TAG" MusicLore.ipa --title "MusicLore $TAG" --notes "$COMMIT_MSG"
          fi

          python3 - "$VERSION" "$BUILD" "$REPO" "$TAG" "$IPA_SIZE" "$NOW_UTC" "$COMMIT_MSG" << 'EOF'
          import json, sys
          version, build, repo, tag, size, date_str, commit_msg = sys.argv[1:]
          source = {
              "name": "MusicLore Source",
              "identifier": "com.personale.musiclore.source",
              "subtitle": "Aggiornamenti automatici per MusicLore",
              "apps": [
                  {
                      "name": "MusicLore",
                      "bundleIdentifier": "com.personale.musiclore",
                      "developerName": repo.split("/")[0],
                      "subtitle": "Storia e spiegazione dei brani su Apple Music",
                      "localizedDescription": "App nativa sincronizzata con Apple Music per mostrare storia, contesto e spiegazione del testo dei brani.",
                      "iconURL": f"https://raw.githubusercontent.com/{repo}/main/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
                      "tintColor": "#1DB954",
                      "versions": [
                          {
                              "version": version,
                              "buildVersion": build,
                              "date": date_str,
                              "localizedDescription": commit_msg or f"Aggiornamento v{version}",
                              "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/MusicLore.ipa",
                              "size": int(size),
                              "minOSVersion": "17.0"
                          }
                      ],
                      "appPermissions": {
                          "entitlements": [],
                          "privacy": {
                              "NSAppleMusicUsageDescription": "Consente di leggere il brano in riproduzione su Apple Music per mostrarne storia, contesto e spiegazione del testo."
                          }
                      }
                  }
              ],
              "news": []
          }
          with open("source.json", "w", encoding="utf-8") as f:
              json.dump(source, f, indent=2, ensure_ascii=False)
          EOF

          TMP_DIR=$(mktemp -d)
          cp source.json "$TMP_DIR/source.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan sidestore-source
          git rm -rf . >/dev/null 2>&1 || true
          cp "$TMP_DIR/source.json" source.json
          git add source.json
          git commit -m "Aggiorna source.json per $TAG"
          git push -f origin sidestore-source