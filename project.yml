name: MusicLore
options:
  bundleIdPrefix: com.personale
  deploymentTarget:
    iOS: "17.0"
targets:
  MusicLore:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: MusicLore
        NSAppleMusicUsageDescription: "Consente di leggere il brano in riproduzione su Apple Music per mostrarne storia, contesto e spiegazione del testo."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personale.musiclore
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"