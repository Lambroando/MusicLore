name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Normalizza icona in PNG 1024x1024
        run: |
          ICON="Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          if [ ! -f "$ICON" ]; then
            echo "ERRORE: File $ICON non trovato nel repository!"
            find Sources -maxdepth 4
            exit 1
          fi
          sips -s format png -z 1024 1024 "$ICON" --out "$ICON"

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera progetto Xcode
        run: xcodegen generate

      - name: Compila app non firmata
        run: |
          xcodebuild \
            -project MusicLore.xcodeproj \
            -scheme MusicLore \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT=build \
            build

      - name: Verifica icona compilata nel bundle
        run: |
          ls -la build/Release-iphoneos/MusicLore.app
          plutil -p build/Release-iphoneos/MusicLore.app/Info.plist
          if [ ! -f "build/Release-iphoneos/MusicLore.app/Assets.car" ]; then
            echo "ERRORE: Assets.car non generato!"
            exit 1
          fi
          if ! plutil -p build/Release-iphoneos/MusicLore.app/Info.plist | grep -q "CFBundleIcons"; then
            echo "ERRORE: CFBundleIcons mancante in Info.plist!"
            exit 1
          fi

      - name: Impacchetta file .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/MusicLore.app Payload/
          zip -r MusicLore.ipa Payload

      - name: Carica .ipa come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLore-IPA
          path: MusicLore.ipa